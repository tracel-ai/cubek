[package]
name = "burn-cubek-drift-repro"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone — do not join Brush's workspace.
[workspace]

[dependencies]
# burn 0e05dc6e is the same revision the original bisect used. It
# pins cubek transitively to ac4b2e48 (post-#191), which is enough
# to trigger the regression. Patch cubek to be1fef47 (see README)
# to confirm it passes pre-#191.
burn = { git = "https://github.com/tracel-ai/burn", rev = "0e05dc6e02e18e2bd586d4119f5bb014c16adcb3", default-features = false, features = ["ndarray", "std"] }
burn-wgpu = { git = "https://github.com/tracel-ai/burn", rev = "0e05dc6e02e18e2bd586d4119f5bb014c16adcb3", default-features = false, features = ["std", "fusion", "autotune"] }
tokio = { version = "1", features = ["macros", "rt"] }

# Default run = unpatched → cubek transitively pulled from burn
# 0e05dc6e = ac4b2e48 (post-#191) → assertion fires.
#
# To confirm pre-#191 passes, check out cubek at be1fef47dcbb1 into
# some path, pin its cubecl dep to match burn's (96d5f722), and
# uncomment this block pointing at that checkout:
#
[patch."https://github.com/tracel-ai/cubek"]
cubek              = { path = "../../cubek-191/crates/cubek" }
cubek-attention    = { path = "../../cubek-191/crates/cubek-attention" }
cubek-convolution  = { path = "../../cubek-191/crates/cubek-convolution" }
cubek-fft          = { path = "../../cubek-191/crates/cubek-fft" }
cubek-matmul       = { path = "../../cubek-191/crates/cubek-matmul" }
cubek-quant        = { path = "../../cubek-191/crates/cubek-quant" }
cubek-random       = { path = "../../cubek-191/crates/cubek-random" }
cubek-reduce       = { path = "../../cubek-191/crates/cubek-reduce" }
cubek-std          = { path = "../../cubek-191/crates/cubek-std" }
cubek-test-utils   = { path = "../../cubek-191/crates/cubek-test-utils" }
