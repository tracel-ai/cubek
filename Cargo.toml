[workspace]
# Try
# require version 2 to avoid "feature" additiveness for dev-dependencies
# https://doc.rust-lang.org/cargo/reference/resolver.html#feature-resolver-version-2
resolver = "2"

exclude = ["crates/.claude"]
members = ["crates/*", "xtask", "benchmarks"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
rust-version = "1.92"
version = "0.3.0-pre.3"

[workspace.dependencies]
### For local development. ###
# cubecl = { path = "../cubecl/crates/cubecl", default-features = false }
# cubecl-common = { path = "../cubecl/crates/cubecl-common", default-features = false }
# cubecl-environment = { path = "../cubecl/crates/cubecl-environment", default-features = false }
# cubecl-ir = { path = "../cubecl/crates/cubecl-ir", default-features = false }
### For the main cubek branch. ###
cubecl = { git = "https://github.com/tracel-ai/cubecl", rev = "c8e971c4fd51c047cfdd964501e12aee31dd3560", default-features = false }
cubecl-common = { git = "https://github.com/tracel-ai/cubecl", rev = "c8e971c4fd51c047cfdd964501e12aee31dd3560", default-features = false }
cubecl-environment = { git = "https://github.com/tracel-ai/cubecl", rev = "c8e971c4fd51c047cfdd964501e12aee31dd3560", default-features = false }
cubecl-ir = { git = "https://github.com/tracel-ai/cubecl", rev = "c8e971c4fd51c047cfdd964501e12aee31dd3560", default-features = false }
### For releases ###
# cubecl = { version = "=0.11.0-pre.3", default-features = false }
# cubecl-common = { version = "=0.11.0-pre.3", default-features = false }
# cubecl-environment = { version = "=0.11.0-pre.3", default-features = false }
# cubecl-ir = { version = "=0.11.0-pre.3", default-features = false }

log = { default-features = false, version = "0.4.22" }

serde = { version = "1.0.204", default-features = false, features = [
    "derive",
    "alloc",
] } # alloc is for no_std, derive is needed

rand = { version = "0.10.0", default-features = false, features = [
    "std_rng",
] } # std_rng is for no_std

# Testing

bytemuck = "1.16.1"
half = { version = "2.5", features = [
    "alloc",
    "num-traits",
    "serde",
], default-features = false }
num-traits = { version = "0.2.19", default-features = false, features = [
    "libm",
] } # libm is for no_std
num-complex = "0.4.6"

thiserror = { version = "2", default-features = false }

### For xtask crate ###
strum = { version = "0.27", features = ["derive"] }
tracel-xtask = { version = "=5.0.0" }

[profile.dev]
debug = 1     # Speed up compilation time and not necessary.
opt-level = 0

[profile.dev.build-override]
opt-level = 3
