[package]
authors = ["louisfd <louisfd94@gmail.com>"]
categories = ["science", "mathematics", "algorithms"]
description = "CubeK: RMS Norm Kernels"
edition.workspace = true
keywords = []
license.workspace = true
name = "cubek-rms-norm"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubek/tree/main/crates/cubek-rms-norm"
version.workspace = true

[lints]
workspace = true

[features]
default = ["std", "cubecl/default"]
std = ["cubecl/std", "cubek-std/std"]

[dependencies]
cubek-matmul = { workspace = true, features = ["tiled"] }
cubek-microkernel = { workspace = true, features = ["rms-norm"] }
cubek-std = { workspace = true }

cubecl = { workspace = true, features = ["stdlib", "tile"] }
serde = { workspace = true }

[dev-dependencies]
cubek-test-utils = { workspace = true }
half = { workspace = true }

cubecl = { workspace = true, features = ["test-runtime"] }
