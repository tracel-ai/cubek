[package]
authors = ["Alexander Meißner <AlexanderMeissner@gmx.net>"]
categories = ["science", "mathematics", "algorithms"]
description = "CubeK: Prefix Scan"
edition.workspace = true
keywords = []
license.workspace = true
name = "cubek-prefix-scan"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubek/tree/main/crates/cubek-prefix-scan"
version.workspace = true

[lints]
workspace = true

[features]
default = ["std", "cubecl/default"]
std = ["cubecl/std", "thiserror/std"]

extended = ["heavy"]
full = ["extended"]
heavy = []

benchmarks = ["cpu-reference", "cubecl/test-runtime"]
cpu-reference = ["dep:cubek-test-utils"]

[dependencies]
cubek-std = { workspace = true }
cubek-test-utils = { workspace = true, optional = true }

cubecl = { workspace = true }
cubecl-common = { workspace = true }

thiserror = { workspace = true }

[dev-dependencies]
cubek-prefix-scan = { path = ".", features = ["cpu-reference", "benchmarks"] }
cubek-test-utils = { workspace = true }
