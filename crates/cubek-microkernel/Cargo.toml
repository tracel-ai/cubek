[package]
authors = ["louisfd <louisfd94@gmail.com>"]
description = "CubeK: Microkernels"
edition.workspace = true
license.workspace = true
name = "cubek-microkernel"
readme.workspace = true
rust-version.workspace = true
repository = "https://github.com/tracel-ai/cubek/tree/main/crates/cubek-microkernel"
version.workspace = true

[lints]
workspace = true

[features]
default = ["std", "matmul", "cubecl/default"]
std = ["cubecl/std", "cubek-std/std"]

# A family's microkernels, each usable without the next one's.
matmul = []
attention = ["matmul"]

[dependencies]
cubek-std = { workspace = true }

cubecl = { workspace = true, features = ["stdlib", "tile"] }
serde = { workspace = true }
