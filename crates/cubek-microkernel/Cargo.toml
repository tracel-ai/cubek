[package]
authors = ["louisfd <louisfd94@gmail.com>"]
description = "CubeK: Microkernels"
edition.workspace = true
license.workspace = true
name = "cubek-microkernel"
readme.workspace = true
rust-version.workspace = true
repository = "https://github.com/tracel-ai/cubek/tree/main/crates/cubek-microkernel"
version.workspace = true

[lints]
workspace = true

[features]
default = ["std", "matmul", "cubecl/default"]
std = ["cubecl/std", "cubek-std/std"]

# A family's microkernels, each usable without the next one's.
matmul = []
attention = ["matmul"]
attention-backward = ["attention"]
random = []
reduce = []
# The host's answer to each reduce operation, for the tests that check the reduce microkernels and
# kernels against it.
cpu-reference = ["reduce"]
zero = []
rms-norm = ["row-store"]
swiglu = ["row-store"]
interpolate = []
pool = []
# Where a producer of rows writes them, as computed or packed for a product's lhs.
row-store = []

[dependencies]
cubek-std = { workspace = true }

cubecl = { workspace = true, features = ["stdlib", "tile"] }
serde = { workspace = true }

[dev-dependencies]
# Enable the reduce reference for tests without publishing a versioned self-dependency.
cubek-microkernel = { path = ".", default-features = false, features = ["cpu-reference"] }
cubek-test-utils = { workspace = true }
half = { workspace = true }
