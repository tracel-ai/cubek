[package]
authors = ["louisfd <louisfd94@gmail.com>"]
description = "CubeK: Standard Library"
edition.workspace = true
license.workspace = true
name = "cubek-std"
readme.workspace = true
rust-version.workspace = true
repository = "https://github.com/tracel-ai/cubek/tree/main/crates/cubek-std"
version.workspace = true

[features]
default = ["cubecl/default"]
std = ["cubecl/std"]

heavy = []
extended = ["heavy"]
full = ["extended"]

# Pulls in `cubek-test-utils` for test/bench-only conversions (e.g.
# `MatrixLayout` → `LayoutSpec`). Off by default.
testing = ["dep:cubek-test-utils", "cubecl/test-runtime"]

# Enables `pub mod benchmarks` — catalogues for the contiguous, unary, and
# memcpy_async subcategories. Off by default; the top-level `benchmarks`
# crate turns it on.
benchmarks = ["testing"]

[dependencies]
cubek-test-utils = { workspace = true, optional = true }

cubecl = { workspace = true, features = ["stdlib"] }
cubecl-common = { workspace = true }

[dev-dependencies]
cubek-test-utils = { workspace = true }
