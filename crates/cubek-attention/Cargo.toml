[package]
authors = ["louisfd <louisfd94@gmail.com>"]
categories = ["science", "mathematics", "algorithms"]
description = "CubeK: Attention Kernels"
edition.workspace = true
keywords = []
license.workspace = true
name = "cubek-attention"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubek/tree/main/crates/cubek-attention"
version.workspace = true

[lints]
workspace = true

[features]
default = ["std", "tiled", "cubecl/default"]
std = ["cubecl/std"]

# The tiled attention's kernels, on the attention microkernels.
tiled = ["cubecl/tile", "cubek-matmul/tiled", "dep:cubek-microkernel"]

[dependencies]
cubek-matmul = { workspace = true }
cubek-microkernel = { workspace = true, optional = true, features = ["attention"] }
cubek-std = { workspace = true }

cubecl = { workspace = true, features = ["stdlib"] }
cubecl-common = { workspace = true }

bytemuck = { workspace = true }
half = { workspace = true, features = ["bytemuck"] }
serde = { workspace = true }

[dev-dependencies]
cubek-test-utils = { workspace = true }

cubecl = { workspace = true, features = ["test-runtime"] }
