[package]
authors = ["louisfd <louisfd94@gmail.com>"]
categories = ["science", "mathematics", "algorithms"]
description = "CubeK: Gated Delta Rule Kernels"
edition.workspace = true
keywords = []
license.workspace = true
name = "cubek-gated-delta"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubek/tree/main/crates/cubek-gated-delta"
version.workspace = true

[lints]
workspace = true

[features]
default = ["std", "cubecl/default"]
std = ["cubecl/std", "cubek-std/std"]
# Autotune compares every candidate's output against the first's: a debugging instrument.
autotune-checks = ["cubecl/autotune-checks", "cubek-matmul/autotune-checks"]
# Enables `eval::benchmarks`, the catalogue of walk problems and routines the top-level
# `benchmarks` crate runs.
benchmarks = ["std", "dep:cubek-test-utils", "cubecl/test-runtime"]

[dependencies]
cubek-matmul = { workspace = true, features = ["tiled"] }
cubek-microkernel = { workspace = true, features = ["gated-delta"] }
cubek-std = { workspace = true }

cubecl = { workspace = true, features = ["stdlib", "tile"] }
cubek-test-utils = { workspace = true, optional = true }
serde = { workspace = true }

[dev-dependencies]
half = { workspace = true }

cubecl = { workspace = true, features = ["test-runtime"] }
