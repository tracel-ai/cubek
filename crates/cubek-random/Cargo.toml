[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science", "mathematics", "algorithms"]
description = "CubeK: Random Number Generation"
edition.workspace = true
keywords = []
license.workspace = true
name = "cubek-random"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubek/tree/main/crates/cubek-random"
version.workspace = true

[features]
default = ["std", "cubecl/default"]
std = ["cubecl/std"]

heavy = []
extended = ["heavy"]
full = ["extended", "benchmarks"]

# Enables `pub mod benchmarks`: catalogue of random benchmark problems,
# strategies, and the bench harness.
benchmarks = ["dep:cubek-test-utils", "cubecl/test-runtime"]

[dependencies]
cubek-std = { workspace = true }
cubek-test-utils = { workspace = true, optional = true }

cubecl = { workspace = true }
cubecl-common = { workspace = true }
cubecl-environment = { workspace = true }

num-traits = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
half = { workspace = true }

[dev-dependencies]
cubecl = { workspace = true, features = ["test-runtime"] }
