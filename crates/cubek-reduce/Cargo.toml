[package]
authors = [
    "nathanielsimard <nathaniel.simard.42@gmail.com>",
    "louisfd <louisfd94@gmail.com>",
    "maxtremblay <t.maxime@pm.me>",
]
categories = ["science", "mathematics", "algorithms"]
description = "CubeK: Reduce Kernels"
edition.workspace = true
keywords = []
license.workspace = true
name = "cubek-reduce"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubek/tree/main/crates/cubek-reduce"
version.workspace = true

[features]
default = ["std", "cubecl/default"]
std = ["cubecl/std", "thiserror/std"]

heavy = []
extended = ["heavy"]
full = ["extended", "benchmarks"]

cpu-reference = ["dep:cubek-test-utils"]
# Enables `pub mod benchmarks` — catalogue of reduce benchmark problems /
# strategies and the bench harness. The seeded `ReduceCorrectness` impl
# inside that module is additionally gated on `cpu-reference`.
benchmarks = ["cpu-reference", "cubecl/test-runtime"]

[dependencies]
cubek-std = { workspace = true }
cubek-test-utils = { workspace = true, optional = true }

cubecl = { workspace = true }

num-traits = { workspace = true }
serde = { workspace = true }
half = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
cubek-reduce = { workspace = true, features = ["cpu-reference"] }
cubek-test-utils = { workspace = true }

cubecl = { workspace = true, features = ["test-runtime"] }
cubecl-common = { workspace = true }
