[package]
authors = [
    "nathanielsimard <nathaniel.simard.42@gmail.com>",
    "louisfd <louisfd94@gmail.com>",
]
categories = ["science", "mathematics", "algorithms"]
description = "CubeK: CubeCL Kernels"
edition.workspace = true
keywords = []
license.workspace = true
name = "cubek"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubek"
version.workspace = true

[lints]
workspace = true

[features]
default = [
    "std",
    "stdlib",
    "cubek-std?/default",
    "cubek-quant?/default",
    "cubek-random?/default",
    "cubek-reduce?/default",
    "cubek-matmul?/default",
    "cubek-microkernel?/default",
    "cubek-convolution?/default",
    "cubek-attention?/default",
    "cubek-attention-backward?/default",
    "cubek-interpolate?/default",
    "cubek-pool?/default",
    "cubek-fft?/default",
]

std = [
    "cubek-std?/std",
    "cubek-quant?/std",
    "cubek-random?/std",
    "cubek-reduce?/std",
    "cubek-matmul?/std",
    "cubek-microkernel?/std",
    "cubek-convolution?/std",
    "cubek-attention?/std",
    "cubek-attention-backward?/std",
    "cubek-interpolate?/std",
    "cubek-pool?/std",
    "cubek-fft?/std",
]

attention = ["cubek-attention"]
# Attention's backward pass, for training: its own crate, off unless a caller asks for it.
attention-backward = ["cubek-attention-backward"]
interpolate = ["cubek-interpolate"]
pool = ["cubek-pool"]
convolution = ["cubek-convolution"]
matmul = ["cubek-matmul", "stdlib"]
# The two matmul kernel architectures, each usable without the other. Both ride
# `cubek-matmul`'s own default; these are for builds that want only one.
matmul-tiled = ["cubek-matmul?/tiled"]
matmul-multi-level = ["cubek-matmul?/multi-level"]
# The microkernels the kernels are built from, for a caller writing kernels of its own.
microkernel = ["cubek-microkernel", "stdlib"]
attention-tiled = ["cubek-attention?/tiled"]
quantization = ["cubek-quant/kernels"]
random = ["cubek-random"]
reduce = ["cubek-reduce"]
stdlib = ["cubek-std"]
fft = ["cubek-fft"]
# Autotune compares every candidate's output against the first's: a debugging instrument.
autotune-checks = ["cubek-matmul?/autotune-checks"]


[dependencies]
cubecl = { workspace = true }
cubek-attention = { workspace = true, optional = true }
cubek-attention-backward = { workspace = true, optional = true }
cubek-convolution = { workspace = true, optional = true }
cubek-fft = { workspace = true, optional = true }
cubek-interpolate = { workspace = true, optional = true }
cubek-matmul = { workspace = true, optional = true }
cubek-microkernel = { workspace = true, optional = true }
cubek-pool = { workspace = true, optional = true }
cubek-quant = { workspace = true, optional = true }
cubek-random = { workspace = true, optional = true }
cubek-reduce = { workspace = true, optional = true }
cubek-std = { workspace = true, optional = true }
