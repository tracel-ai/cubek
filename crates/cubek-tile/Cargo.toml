[package]
authors = ["louisfd <louisfd94@gmail.com>"]
description = "CubeK: Tile"
edition.workspace = true
license.workspace = true
name = "cubek-tile"
readme.workspace = true
rust-version.workspace = true
repository = "https://github.com/tracel-ai/cubek/tree/main/crates/cubek-tile"
version.workspace = true

[features]
default = ["cubecl/default"]
std = ["cubecl/std"]

heavy = []
extended = ["heavy"]
full = ["extended"]

[dependencies]
cubecl = { workspace = true, features = ["stdlib"] }
cubecl-common = { workspace = true }

bytemuck = { workspace = true }
half = { workspace = true, features = ["bytemuck"] }
serde = { workspace = true }

[dev-dependencies]
cubecl = { workspace = true, features = ["test-runtime"] }
# Omit versions so Cargo excludes these dev-dependencies when publishing;
# both crates depend on cubek-tile and must be published after it.
cubek-quant = { path = "../cubek-quant", default-features = false }
cubek-test-utils = { path = "../cubek-test-utils", default-features = false }
