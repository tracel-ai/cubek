[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science", "mathematics", "algorithms"]
description = "CubeK: Quantization Library"
edition.workspace = true
keywords = []
license.workspace = true
name = "cubek-quant"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubek/tree/main/crates/cubek-quant"
version.workspace = true

[lints]
workspace = true

[features]
default = ["kernels"]
# `cubecl` and `cubek-std` are not `no_std`. Keep them behind `kernels`, which
# already requires `std`, so `--no-default-features` can build the scheme API.
kernels = ["std", "dep:cubek-std", "dep:cubecl"]
std = []

heavy = []
extended = ["heavy"]
full = ["extended"]

[dependencies]
cubek-std = { workspace = true, optional = true }

cubecl = { workspace = true, optional = true, features = ["tile"] }
cubecl-common = { workspace = true, features = ["fp8"] }

half.workspace = true
serde = { workspace = true }

[dev-dependencies]
cubek-test-utils = { workspace = true, features = ["std"] }

cubecl = { workspace = true, features = ["test-runtime"] }
