[package]
authors = [
    "nathanielsimard <nathaniel.simard.42@gmail.com>",
    "louisfd <louisfd94@gmail.com>",
]
categories = ["science", "mathematics", "algorithms"]
description = "CubeK: Benchmarks"
edition.workspace = true
keywords = []
license.workspace = true
name = "benchmarks"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubek"
version.workspace = true

[features]

[lib]
path = "src/lib.rs"

[dependencies]
cubecl = { workspace = true, features = ["test-runtime", "stdlib"] }
cubek = { path = "../crates/cubek", version = "=0.2.0-pre.4", default-features = false, features = [
    "stdlib",
    "random",
    "reduce",
    "matmul",
    "convolution",
    "attention",
    "fft",
    "quantization",
] }
# Direct deps on individual kernel crates with their `cpu-reference` features
# enabled so the correctness path can reach the CPU references. The umbrella
# `cubek` crate's feature gates don't expose cpu-reference today.
cubek-matmul = { path = "../crates/cubek-matmul", version = "=0.2.0-pre.4", features = ["cpu-reference"] }
cubek-test-utils = { path = "../crates/cubek-test-utils", version = "=0.2.0-pre.4" }
half = { workspace = true }

[[bench]]
harness = false
name = "gemm"

[[bench]]
harness = false
name = "gemv"

[[bench]]
harness = false
name = "reduce"

[[bench]]
harness = false
name = "conv2d"

[[bench]]
harness = false
name = "memcpy_async"

[[bench]]
harness = false
name = "unary"

[[bench]]
harness = false
name = "attention"

[[bench]]
harness = false
name = "contiguous"

[[bench]]
harness = false
name = "fft"

[[bench]]
harness = false
name = "quantized_matmul"
