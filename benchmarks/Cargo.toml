[package]
authors = [
    "nathanielsimard <nathaniel.simard.42@gmail.com>",
    "louisfd <louisfd94@gmail.com>",
]
categories = ["science", "mathematics", "algorithms"]
description = "CubeK: Benchmarks"
edition.workspace = true
keywords = []
license.workspace = true
name = "benchmarks"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubek"
version.workspace = true

[features]
# Pulls in each kernel crate's `cpu-reference` feature so categories can return
# CPU-reference HostData via `BenchmarkCategory::reference_result`. The umbrella
# `cubek` crate doesn't re-expose `cpu-reference` today, so consumers that need
# the correctness flow turn it on here and pick up the per-kernel toggle.
cpu-reference = [
    "cubek-attention/cpu-reference",
    "cubek-matmul/cpu-reference",
    "cubek-interpolate/cpu-reference",
    "cubek-pool/cpu-reference",
    "cubek-convolution/cpu-reference",
    "cubek-fft/cpu-reference",
    "cubek-reduce/cpu-reference",
]

[lib]
path = "src/lib.rs"

[dependencies]
cubek = { workspace = true, features = [
    "stdlib",
    "random",
    "reduce",
    "matmul",
    "convolution",
    "attention",
    "interpolate",
    "pool",
    "fft",
    "quantization",
] }
cubek-attention = { workspace = true, default-features = true, features = ["benchmarks"] }
cubek-convolution = { workspace = true, default-features = true, features = ["benchmarks"] }
cubek-fft = {workspace = true, default-features = true, features = ["benchmarks"] }
cubek-interpolate = { workspace = true, default-features = true, features = ["benchmarks"] }
cubek-matmul = { workspace = true, default-features = true, features = ["benchmarks"] }
cubek-pool = { workspace = true, default-features = true, features = ["benchmarks"] }
cubek-random = { workspace = true, default-features = true, features = ["benchmarks"] }
cubek-reduce = { workspace = true, default-features = true, features = ["benchmarks"] }
cubek-std = { workspace = true, default-features = true, features = ["benchmarks"] }
cubek-test-utils = { workspace = true, default-features = true }

cubecl = { workspace = true, features = ["test-runtime", "stdlib"] }
half = { workspace = true }

